name: Lint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  copyright:
    name: Copyright headers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Check copyright headers
        run: python3 tools/copyright_headers.py --check

  mac-launcher:
    name: macOS launcher unit and lint checks
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.25'
          cache-dependency-path: launcher/mac/go.sum

      - name: Install Task
        run: brew install go-task

      - name: Run macOS launcher unit tests
        run: task tests-unit

      - name: Run lint checks
        run: task lint
