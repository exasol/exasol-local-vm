name: Build macOS local-vm provider

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      IOS_PKCS12_IDENTITY_CERTIFICATE_BASE64_ENCODED:
        required: true
      IOS_PKCS12_IDENTITY_CERTIFICATE_PASSWORD:
        required: true
      IOS_CER_DEVELOPERID_APPLICATION_BASE64_ENCODED:
        required: true
      IOS_APPSTORECONNECTAPI_ISSUERID:
        required: true
      IOS_APPSTORECONNECTAPI_KEYID:
        required: true
      IOS_APPSTORECONNECTAPI_AUTHKEY:
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build-vm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Install Task
        run: sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin
      - name: Install build dependencies
        run: task install-deps
      - name: Build workload-neutral VM image
        run: task package-mac IMG_ARCH=aarch64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vm-package
          path: release/mac-arm64.tar.xz

  build-provider:
    runs-on: macos-15
    needs: build-vm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25"
          cache-dependency-path: launcher/mac/go.sum
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vm-package
          path: release
      - name: Install Task
        run: brew install go-task
      - name: Configure signing
        id: macos-signing
        uses: ./.github/actions/setup-macos-signing
        with:
          p12-key: ${{ secrets.IOS_PKCS12_IDENTITY_CERTIFICATE_BASE64_ENCODED }}
          p12-password: ${{ secrets.IOS_PKCS12_IDENTITY_CERTIFICATE_PASSWORD }}
          application-cert: ${{ secrets.IOS_CER_DEVELOPERID_APPLICATION_BASE64_ENCODED }}
      - name: Build and sign provider
        env:
          MACOS_SIGN_KEYCHAIN: ${{ steps.macos-signing.outputs.keychain-path }}
          MACOS_SIGN_IDENTITY: ${{ steps.macos-signing.outputs.signing-identity }}
        run: task build-mac-provider IMG_ARCH=aarch64
      - name: Run provider unit tests
        working-directory: launcher/mac
        run: |
          tar -C ../assets -cf - init | xz -9 > init-assets.tar.xz
          cp ../../release/mac-arm64.tar.xz vm-package.tar.xz
          go test ./...
      - name: Package provider
        run: |
          mkdir -p dist
          ditto -c -k release/local-vm/darwin/aarch64 dist/local-vm-darwin-arm64.zip
          shasum -a 256 dist/local-vm-darwin-arm64.zip > dist/local-vm-darwin-arm64.zip.sha256
      - name: Run generic provider integration tests
        working-directory: tests
        env:
          PROVIDER_ZIP: ../dist/local-vm-darwin-arm64.zip
        run: go test -timeout 30m ./...
      - name: Notarize provider
        env:
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.IOS_APPSTORECONNECTAPI_ISSUERID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.IOS_APPSTORECONNECTAPI_KEYID }}
          MACOS_NOTARY_KEY: ${{ secrets.IOS_APPSTORECONNECTAPI_AUTHKEY }}
        run: |
          key_path="$(mktemp /tmp/notary-key.XXXXXX.p8)"
          trap 'rm -f "$key_path"' EXIT
          printf '%s' "$MACOS_NOTARY_KEY" > "$key_path"
          xcrun notarytool submit dist/local-vm-darwin-arm64.zip \
            --issuer "$MACOS_NOTARY_ISSUER_ID" \
            --key-id "$MACOS_NOTARY_KEY_ID" \
            --key "$key_path" \
            --wait
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: local-vm-provider
          path: |
            dist/local-vm-darwin-arm64.zip
            dist/local-vm-darwin-arm64.zip.sha256
