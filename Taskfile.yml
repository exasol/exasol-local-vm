version: '3'

tasks:
  lint:
    desc: Run all lint checks
    cmds:
      - task: lint-copyright

  lint-copyright:
    desc: Check configured source files for copyright and SPDX headers
    cmds:
      - python3 tools/copyright_headers.py --check

  fix-copyright:
    desc: Add missing copyright and SPDX headers to configured source files
    cmds:
      - python3 tools/copyright_headers.py --fix

  install-deps:
    desc: Install host dependencies for building and running the VM with Podman on Linux
    run: once
    cmds:
      - sudo apt-get update
      - sudo apt-get install -y jq podman xz-utils qemu-user-static
      - sudo systemctl restart systemd-binfmt

  build:
    desc: Build kernel, initramfs, and raw disk image through the Podman builder stages for {{.IMG_ARCH}}
    run: when_changed
    requires:
      vars:
        - name: IMG_ARCH
          enum: [x86_64, aarch64]
    cmds:
      - ./host/build/build-artifacts.sh "{{.IMG_ARCH}}"

  build-qemu-container:
    desc: Build the Podman/QEMU runner container image for starting the VM
    run: once
    cmds:
      - podman build --arch "$(uname -m)" -t exasol-local-vm-runner:latest host/run

  ensure-vm-image:
    run: when_changed
    requires:
      vars:
        - name: IMG_ARCH
          enum: [x86_64, aarch64]
    status:
      - test -f output/{{.IMG_ARCH}}/disk.img
      - test -f output/{{.IMG_ARCH}}/arch.txt
      - test -f output/{{.IMG_ARCH}}/vmlinuz-virt
      - test -f output/{{.IMG_ARCH}}/initramfs.img
      - test -f output/{{.IMG_ARCH}}/kernel-cmdline.txt
    cmds:
      - task: build
        vars:
          IMG_ARCH: "{{.IMG_ARCH}}"

  ensure-qemu-container:
    status:
      - podman image exists exasol-local-vm-runner:latest
    cmds:
      - task: build-qemu-container

  start-vm:
    desc: Start the VM in a detached Podman runner container
    run: once
    requires:
      vars:
        - name: IMG_ARCH
          enum: [x86_64, aarch64]
    deps:
      - task: ensure-vm-image
        vars:
          IMG_ARCH: "{{.IMG_ARCH}}"
      - ensure-qemu-container
    cmds:
      - ./host/run/start-qemu-container.sh "{{.IMG_ARCH}}"

  start-vm-attached:
    desc: Start the VM in an attached Podman runner container
    run: once
    requires:
      vars:
        - name: IMG_ARCH
          enum: [x86_64, aarch64]
    deps:
      - task: ensure-vm-image
        vars:
          IMG_ARCH: "{{.IMG_ARCH}}"
      - ensure-qemu-container
    cmds:
      - ./host/run/start-qemu-container.sh -a "{{.IMG_ARCH}}"

  stop-vm:
    desc: Stop the Podman runner container for the VM
    cmds:
      - ./host/run/stop-qemu-container.sh

  test-provider-integration:
    desc: |
      Run the generic provider integration tests in ./tests on macOS. The
      fixture uses ../dist/local-vm-darwin-arm64.zip by default; override with
      PROVIDER_ZIP.
    cmds:
      - cd tests && go test -timeout 30m ./...

  package-mac:
    desc: Package the raw UEFI disk for the macOS provider
    run: when_changed
    requires:
      vars:
        - name: IMG_ARCH
          enum: [aarch64]
    deps:
      - task: ensure-vm-image
        vars:
          IMG_ARCH: "{{.IMG_ARCH}}"
    cmds:
      - ./host/package/package-mac.sh "{{.IMG_ARCH}}"

  build-mac-provider:
    desc: Build the macOS provider binary (must be run on macOS)
    run: when_changed
    requires:
      vars:
        - name: IMG_ARCH
          enum: [aarch64]
    cmds:
      - ./host/package/build-mac-launcher.sh "{{.IMG_ARCH}}"

  build-mac-development-provider:
    desc: Build an unsigned local-vm artifact for Personal RUNNER_PATH testing
    requires:
      vars:
        - name: IMG_ARCH
          enum: [aarch64]
    env:
      ALLOW_UNSIGNED_LOCAL_VM: "1"
      PROVIDER_VERSION: "dev"
    cmds:
      - ./host/package/build-mac-launcher.sh "{{.IMG_ARCH}}"

  package:
    desc: Build all distributable packages
    deps:
      - task: package-mac
        vars:
          IMG_ARCH: aarch64

  clean:
    desc: Remove generated files
    cmds:
      - task: stop-vm
      - git clean -Xf .

  ci-build-mac-provider:
    desc: Run the macOS provider workflow on the current branch and download its artifact
    cmds:
      - ./host/github/ci-build-mac-launcher.sh
