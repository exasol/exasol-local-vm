version: '3'

tasks:
  lint:
    desc: Run all lint checks
    cmds:
      - task: lint-copyright
      - task: lint-shell
      - task: lint-go-format
      - task: lint-go-mac

  lint-copyright:
    desc: Check configured source files for copyright and SPDX headers
    cmds:
      - python3 tools/copyright_headers.py --check

  fix-copyright:
    desc: Add missing copyright and SPDX headers to configured source files
    cmds:
      - python3 tools/copyright_headers.py --fix

  lint-shell:
    desc: Check shell script syntax
    cmds:
      - git ls-files -z '*.sh' | xargs -0 bash -n

  lint-go-format:
    desc: Check Go formatting
    cmds:
      - test -z "$(gofmt -l launcher/mac/*.go tests/*.go)"

  lint-go-mac:
    desc: Check the macOS launcher module and Go source
    platforms: [darwin]
    cmds:
      - ./host/package/with-mac-embed-placeholders.sh go mod tidy -diff
      - ./host/package/with-mac-embed-placeholders.sh go vet ./...

  tests-unit:
    desc: Run macOS launcher unit tests with the race detector
    platforms: [darwin]
    cmds:
      - ./host/package/with-mac-embed-placeholders.sh go test -race ./...

  install-deps:
    desc: Install host dependencies for building and running the VM with Podman on Linux
    run: once
    cmds:
      - sudo apt-get update
      - sudo apt-get install -y jq podman xz-utils qemu-user-static
      - sudo systemctl restart systemd-binfmt

  build:
    desc: Build kernel, initramfs, and raw disk images through the podman builder stages for {{.IMG_ARCH}}
    run: when_changed
    requires:
      vars:
        - name: IMG_ARCH
          enum: [x86_64, aarch64]
    cmds:
      - ./host/build/build-artifacts.sh "{{.IMG_ARCH}}"

  build-qemu-container:
    desc: Build the Podman/QEMU launcher container image for starting the VM
    run: once
    cmds:
      - podman build --arch "$(uname -m)" -t exasol-local-vm-launcher:latest host/run

  ensure-vm-image:
    run: when_changed
    requires:
      vars:
        - name: IMG_ARCH
          enum: [x86_64, aarch64]
    status:
      - test -f output/{{.IMG_ARCH}}/disk.img
      - test -f output/{{.IMG_ARCH}}/disk_thin.img
      - test -f output/{{.IMG_ARCH}}/arch.txt
      - test -f output/{{.IMG_ARCH}}/vmlinuz-virt
      - test -f output/{{.IMG_ARCH}}/initramfs.img
      - test -f output/{{.IMG_ARCH}}/kernel-cmdline.txt
    cmds:
      - task: build
        vars:
          IMG_ARCH: "{{.IMG_ARCH}}"

  ensure-qemu-container:
    status:
      - podman image exists exasol-local-vm-launcher:latest
    cmds:
      - task: build-qemu-container

  start-vm:
    desc: Start the VM in a detached Podman launcher container
    run: once
    requires:
      vars:
        - name: IMG_ARCH
          enum: [x86_64, aarch64]
    deps:
      - task: ensure-vm-image
        vars:
          IMG_ARCH: "{{.IMG_ARCH}}"
      - ensure-qemu-container
    cmds:
      - ./host/run/start-qemu-container.sh "{{.IMG_ARCH}}"

  start-vm-attached:
    desc: Start the VM in an attached Podman launcher container
    run: once
    requires:
      vars:
        - name: IMG_ARCH
          enum: [x86_64, aarch64]
    deps:
      - task: ensure-vm-image
        vars:
          IMG_ARCH: "{{.IMG_ARCH}}"
      - ensure-qemu-container
    cmds:
      - ./host/run/start-qemu-container.sh -a "{{.IMG_ARCH}}"

  stop-vm:
    desc: Stop the Podman launcher container for the VM
    cmds:
      - ./host/run/stop-qemu-container.sh

  test-launcher-integration:
    desc: |
      Run macOS launcher integration tests in ./tests. The fixture looks for
      ../dist/mac-launcher-aarch64.zip by default; override it with the
      LAUNCHER_ZIP environment variable.
    cmds:
      - cd tests && go test -timeout 30m ./...

  package-mac:
    desc: Package the raw UEFI disk for macOS/vfkit users
    run: when_changed
    requires:
      vars:
        - name: IMG_ARCH
          enum: [aarch64]
    deps:
      - task: ensure-vm-image
        vars:
          IMG_ARCH: "{{.IMG_ARCH}}"
    cmds:
      - ./host/package/package-mac.sh "{{.IMG_ARCH}}"

  build-mac-launcher:
    desc: Build the macOS launcher binary (must be run on macOS)
    run: when_changed
    requires:
      vars:
        - name: IMG_ARCH
          enum: [aarch64, x86_64]
    cmds:
      - ./host/package/build-mac-launcher.sh "{{.IMG_ARCH}}"

  package:
    desc: Build all distributable packages
    deps:
      - task: package-mac
        vars:
          IMG_ARCH: aarch64

  clean:
    desc: Remove generated files
    cmds:
      - task: stop-vm
      - git clean -Xf .

  ci-build-mac-launcher:
    desc: Run Build Packages workflow on current branch and download macOS launcher
    vars:
      # if you are only changing macOS launcher code, you can skip the vm disk build to speed up the workflow.
      # note: you must have a recent successful vm disk build in the same branch for the workflow to use instead.
      SKIP_LINUX_BUILD: '{{.SKIP_LINUX_BUILD | default "false"}}'
      # If SKIP_LINUX_BUILD is true, you can optionally specify a previous workflow run ID to download the vm disk
      # build artifacts from instead of the latest successful run.
      PREVIOUS_RUN_ID: '{{.PREVIOUS_RUN_ID | default ""}}'
    cmds:
      - |
        {{if eq .SKIP_LINUX_BUILD "true"}}
          {{if ne .PREVIOUS_RUN_ID ""}}
            ./host/github/ci-build-mac-launcher.sh --skip-linux-build --use-run-id {{.PREVIOUS_RUN_ID}}
          {{else}}
            ./host/github/ci-build-mac-launcher.sh --skip-linux-build
          {{end}}
        {{else}}
          ./host/github/ci-build-mac-launcher.sh
        {{end}}
